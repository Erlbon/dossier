name: Build

# The Mac and Linux builds (the owner, 2026-11-18, cards 41-43 and Linux option A).
# Since 2026-11-23 (the owner's option B: a colleague downloads the Mac build from the release page) they also go ON the release:
# - When redactor_common's release tool publishes a release from the owner's PC (it creates it as a pre-release, which counts as
#   "published"), this workflow builds that tag and adds the Mac zip and the Linux tarball to it. The Windows files and the
#   update manifest are still made on the PC; the Mac and Linux builds do not update themselves (43A), so the manifest stays as is.
# - By hand, for a release already out:  gh workflow run build.yml -f tag=v2026-11-23-04
# - By hand with no tag: build main and leave the archives on the run's page (Artifacts) only.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach the archives to (empty: build main, run page only)"
        required: false
        default: ""

permissions:
  contents: write     # gh release upload

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  mac:
    # macos-latest is Apple Silicon. The app is unsigned (42A): PyInstaller signs it ad hoc, which Apple Silicon needs to start it
    # at all; the note in the zip says how to get past the first stop.
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install what the program and the build need
        run: python -m pip install -r requirements.txt "pyinstaller>=6.6"

      - name: Make the Mac icon from the master SVG
        run: |
          mkdir -p build
          python tools/make_icons.py --icns build/dossier.icns

      - name: Build Dossier.app
        run: python -m PyInstaller dossier.spec --noconfirm

      - name: Try it
        run: |
          dist/Dossier.app/Contents/MacOS/dossier --version
          codesign --verify --verbose dist/Dossier.app

      - name: Zip it with the note
        id: pack
        run: |
          BUILD=$(python -c "from dossier.core.version import APP_VERSION; print(APP_VERSION.replace('#', '-'))")
          NAME="dossier-mac-arm64-$BUILD.zip"
          mkdir pack
          cp -R dist/Dossier.app pack/
          cp packaging/mac/how-to-open.txt "pack/How to open Dossier.txt"
          ditto -c -k --sequesterRsrc pack "$NAME"
          ls -l "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.name }}
          path: ${{ steps.pack.outputs.name }}
          if-no-files-found: error

      - name: Add it to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ steps.pack.outputs.name }}" --clobber --repo "${{ github.repository }}"

  linux:
    # Ubuntu 22.04: its glibc is old enough that the build runs on Debian 12 and Ubuntu 22.04 and newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the libraries Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-xinerama0 libfontconfig1 fontconfig

      - name: Install what the program and the build need
        run: python -m pip install -r requirements.txt "pyinstaller>=6.6"

      - name: Build the folder
        run: python -m PyInstaller dossier.spec --noconfirm

      - name: Try it
        run: |
          dist/dossier/dossier --version
          test "$(cat dist/dossier/update-channel)" = "linux-tarball"

      - name: Pack the tarball
        id: pack
        run: |
          BUILD=$(python -c "from dossier.core.version import APP_VERSION; print(APP_VERSION.replace('#', '-'))")
          NAME="dossier-linux-x86_64-$BUILD.tar.gz"
          cp packaging/linux/README.txt dist/dossier/
          cp dossier/gui/appicon/dossier-256.png dist/dossier/dossier.png
          tar -czf "$NAME" -C dist dossier
          ls -l "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.name }}
          path: ${{ steps.pack.outputs.name }}
          if-no-files-found: error

      - name: Add it to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ steps.pack.outputs.name }}" --clobber --repo "${{ github.repository }}"
