name: Tests

on:
  workflow_dispatch:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        # macOS and Ubuntu added 2026-11-18 (the owner's option A): to see what breaks there before a Mac build is made.
        # macos-latest is Apple Silicon.
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25          # the whole suite takes 4 to 10 minutes on Windows; a first run elsewhere may be slower
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Needed once the GUI shell exists; harmless for the Qt-free core.
      - name: Install headless Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-xinerama0 libfontconfig1 fontconfig

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q dossier tests

      - name: Run tests
        run: pytest -q
