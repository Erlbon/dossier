[project]
name = "dossier"
version = "0.0.1"
description = "Multi-window file manager with a shared selection, Markdown notes and file metadata"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = ["send2trash>=1.8"]

[project.optional-dependencies]
gui = ["PyQt6>=6.6"]

[project.gui-scripts]
dossier = "dossier.gui.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # bare `pytest` finds the package without an install

[tool.setuptools.package-data]
dossier = ["gui/icons/*.svg", "gui/icons/*.txt"]
