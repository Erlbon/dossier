[project]
name = "dossier"
version = "2026.11.5.19"
description = "Multi-window file manager with a shared selection, Markdown notes and file metadata"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "send2trash>=1.8",
    "pywin32>=306; sys_platform == 'win32'",   # send2trash's modern recycle bin (requirements.txt says why)
    "keyring>=24",
    "PyQt6>=6.6",
    "PyQt6-QScintilla>=2.14",
    "redactor_common @ git+https://github.com/Erlbon/redactor_common.git@2026-11-05-03",   # pin a tag, never @main
]

[project.optional-dependencies]
gui = ["PyQt6>=6.6", "PyQt6-QScintilla>=2.14"]
archives = ["py7zr>=0.21"]          # 7z archives as folders; RAR and the rest use an installed 7-Zip

[project.gui-scripts]
dossier = "dossier.gui.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # bare `pytest` finds the package without an install
markers = ["short_nav_budget: the panel gets its real 0.15 s to list a folder before it goes pending (tests of slow folders)"]

[tool.setuptools.package-data]
dossier = ["gui/icons/*/*.svg", "gui/icons/*/*.txt", "gui/icons/*/*.json", "gui/appicon/*.svg", "gui/appicon/*.ico", "gui/appicon/*.png"]
